<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>北京求职看板 · 胡蕊</title>
  <meta name="description" content="基于简历的北京地区求职辅助方案：潘家园通勤1小时圈岗位匹配、薪资、技能缺口与投递优先级看板。" />
  <style>
:root {
  --bg: #f4f6fb;
  --card: #ffffff;
  --ink: #1f2733;
  --muted: #6b7785;
  --line: #e6eaf2;
  --brand: #2b579a;
  --brand-soft: #eaf0fb;
  --a: #1f9d6b;   /* 高优先 A 绿 */
  --b: #e6a23c;   /* 中优先 B 橙 */
  --c: #d9534f;   /* 低优先 C 红 */
  --shadow: 0 2px 10px rgba(31,39,51,.06);
  --radius: 14px;
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Segoe UI", Roboto, sans-serif;
  background: var(--bg);
  color: var(--ink);
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}
.page { max-width: 1080px; margin: 0 auto; padding: 18px 16px 60px; }

/* Hero */
.hero {
  display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 14px;
  background: linear-gradient(135deg, #2b579a 0%, #3f74c4 100%);
  color: #fff; border-radius: var(--radius); padding: 22px 24px; box-shadow: var(--shadow);
}
.hero-main { display: flex; align-items: center; gap: 16px; }
.avatar {
  width: 56px; height: 56px; border-radius: 50%; background: rgba(255,255,255,.18);
  display: flex; align-items: center; justify-content: center; font-size: 26px; font-weight: 700;
  border: 2px solid rgba(255,255,255,.4);
}
.hero h1 { margin: 0; font-size: 22px; letter-spacing: .5px; }
.subtitle { margin: 2px 0 4px; font-size: 14px; opacity: .95; font-weight: 500; }
.anchor { margin: 0; font-size: 13px; opacity: .85; }
.hero-meta { text-align: right; display: flex; flex-direction: column; gap: 6px; align-items: flex-end; }
.badge.auto { background: rgba(255,255,255,.18); border: 1px solid rgba(255,255,255,.35); padding: 4px 10px; border-radius: 999px; font-size: 12px; }
.updated { font-size: 12px; opacity: .85; }

/* Stats */
.stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin: 16px 0; }
.stat { background: var(--card); border-radius: var(--radius); padding: 14px 16px; box-shadow: var(--shadow); text-align: center; }
.stat .num { font-size: 26px; font-weight: 700; color: var(--brand); }
.stat .lbl { font-size: 12px; color: var(--muted); margin-top: 2px; }

/* Charts */
.charts { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 18px; }
.card { background: var(--card); border-radius: var(--radius); padding: 16px; box-shadow: var(--shadow); }
.chart-card h3 { margin: 0 0 10px; font-size: 15px; }
.chart-card:last-child { grid-column: 1 / -1; }

/* Controls */
.controls { margin-bottom: 14px; }
.tabs { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
.tab {
  flex: 1; min-width: 160px; cursor: pointer; border: 1px solid var(--line); background: var(--card);
  padding: 12px 14px; border-radius: 12px; font-size: 15px; font-weight: 600; color: var(--ink);
  display: flex; align-items: center; justify-content: center; gap: 8px; transition: .15s;
}
.tab .cnt { background: var(--brand-soft); color: var(--brand); border-radius: 999px; padding: 1px 9px; font-size: 12px; }
.tab.active { background: var(--brand); color: #fff; border-color: var(--brand); }
.tab.active .cnt { background: rgba(255,255,255,.25); color: #fff; }

.filters { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.filters input[type="search"] {
  flex: 1; min-width: 200px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; font-size: 14px; background: var(--card);
}
.filters select { padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; font-size: 14px; background: var(--card); }
.switch { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); cursor: pointer; }
.switch input { width: 16px; height: 16px; }

/* Job cards */
.joblist { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.job {
  background: var(--card); border-radius: var(--radius); padding: 16px; box-shadow: var(--shadow);
  border-left: 5px solid var(--line); display: flex; flex-direction: column; gap: 10px; position: relative;
}
.job.lvA { border-left-color: var(--a); }
.job.lvB { border-left-color: var(--b); }
.job.lvC { border-left-color: var(--c); }
.job .topline { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
.job h4 { margin: 0; font-size: 16px; }
.job .company { font-size: 13px; color: var(--muted); margin-top: 2px; }
.pri {
  flex-shrink: 0; font-weight: 700; font-size: 13px; padding: 4px 10px; border-radius: 999px; color: #fff; white-space: nowrap;
}
.pri.A { background: var(--a); } .pri.B { background: var(--b); } .pri.C { background: var(--c); }

.tags { display: flex; flex-wrap: wrap; gap: 6px; }
.tag { font-size: 12px; padding: 3px 9px; border-radius: 8px; background: var(--brand-soft); color: var(--brand); }
.tag.dist { background: #eaf7f0; color: #1f9d6b; }
.tag.dist.warn { background: #fff3e0; color: #e6a23c; }
.tag.dist.over { background: #fdecea; color: #d9534f; }
.tag.match { background: #eef0f5; color: #4a5568; }

.matchbar { height: 8px; border-radius: 6px; background: #eef0f5; overflow: hidden; }
.matchbar > i { display: block; height: 100%; border-radius: 6px; background: linear-gradient(90deg,#2b579a,#3f74c4); }

.gap { font-size: 13px; color: #44505e; background: #f8fafc; border: 1px solid var(--line); border-radius: 10px; padding: 9px 11px; }
.gap b { color: var(--ink); }
.skills { display: flex; flex-wrap: wrap; gap: 5px; }
.skills .s { font-size: 11px; padding: 2px 7px; border-radius: 6px; background: #f0f3f9; color: #5a6675; }

.note { font-size: 12px; color: var(--muted); }
.note::before { content: "💡 "; }

.job .actions { display: flex; gap: 8px; margin-top: auto; }
.btn-link {
  flex: 1; text-align: center; text-decoration: none; background: var(--brand); color: #fff;
  padding: 9px 12px; border-radius: 10px; font-size: 13px; font-weight: 600; transition: .15s;
}
.btn-link:hover { background: #24487f; }
.btn-link.dead { background: #9aa6b2; pointer-events: none; }
.src { font-size: 11px; color: var(--muted); align-self: center; white-space: nowrap; }

/* Footer */
.foot { margin-top: 24px; font-size: 12px; color: var(--muted); text-align: center; line-height: 1.7; }
.foot p { margin: 4px 0; }

.empty { grid-column: 1/-1; text-align: center; color: var(--muted); padding: 40px; }

/* 继续查询按钮 */
.load-more {
  cursor: pointer; border: none; background: linear-gradient(135deg, #2b579a 0%, #3f74c4 100%);
  color: #fff; font-size: 15px; font-weight: 600; padding: 12px 26px; border-radius: 999px;
  box-shadow: var(--shadow); transition: .15s;
}
.load-more:hover { opacity: .92; transform: translateY(-1px); }
.load-more:active { transform: translateY(0); }

/* 跨行业子标签 */
.subtabs { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0 4px; padding-left: 2px; }
.subtab {
  cursor: pointer; border: 1px solid #e5e9f0; background: #fff; color: #2b3240;
  font-size: 13px; font-weight: 500; padding: 6px 14px; border-radius: 999px; transition: .15s;
}
.subtab:hover { border-color: #3f74c4; color: #3f74c4; }
.subtab.active { background: #3f74c4; border-color: #3f74c4; color: #fff; }

@media (max-width: 760px) {
  .stats { grid-template-columns: repeat(2, 1fr); }
  .charts { grid-template-columns: 1fr; }
  .chart-card:last-child { grid-column: auto; }
  .joblist { grid-template-columns: 1fr; }
  .hero { flex-direction: column; align-items: flex-start; }
  .hero-meta { align-items: flex-start; text-align: left; }
}

</style>
</head>

/job.jdzj.com/job3985652.shtml", "source": "机电招聘网", "posted": "近期在招", "note": "亦庄，临界通勤；文档能力迁移首选之一。", "link_ok": true}, {"id": 35, "tab": 2, "subtab": "doc", "batch": 2, "company": "某AI芯片企业（北京）", "title": "产品文档工程师", "salary_text": "20-40k", "salary_min": 20, "salary_max": 40, "location": "海淀区", "commute_min": 45, "circle": "良", "within_1h": true, "skills": ["技术文档体系", "芯片/数据中心文档", "Photoshop/Visio", "中英文撰写", "3-5年"], "gap": "她文档/标准编制能力可迁移；但要求3-5年+AI芯片技术理解+英文优异，她经验<1年 → 中-大缺口，薪资高。", "match": 58, "salary_score": 100, "commute_score": 30.0, "priority": 64, "priority_level": "B", "link": "https://www.liepin.com/job/1975853485.shtml", "source": "猎聘", "posted": "2026-08-05", "note": "海淀，高薪（20-40k）文档岗，作冲刺。", "link_ok": true}]};</script>
  <script>
/* 北京求职看板 — 前端逻辑 */
(function () {
  "use strict";

  var DATA = null;
  var state = { tab: 1, subtab: "all", sort: "priority", only1h: false, q: "", showBatch2: false };

  var COLORS = { A: "#1f9d6b", B: "#e6a23c", C: "#d9534f" };

  function el(id) { return document.getElementById(id); }
  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  function load() {
    if (window.__DATA__) { DATA = window.__DATA__; init(); return; }
    fetch("./data/jobs.json?t=" + Date.now())
      .then(function (r) { return r.json(); })
      .then(function (d) { DATA = d; init(); })
      .catch(function (e) {
        el("joblist").innerHTML =
          '<div class="empty">⚠️ 数据加载失败，请确认已部署 data/jobs.json。<br>' + esc(e) + "</div>";
      });
  }

  function init() {
    var m = DATA.meta, c = m.candidate;
    el("heroTarget").textContent = c.target;
    el("heroAnchor").textContent = c.anchor;
    el("heroUpdated").textContent = "更新于 " + m.updated_at + " (" + m.timezone + ")";
    el("cnt1").textContent = m.tab1_count;
    el("cnt2").textContent = m.tab2_count;
    el("footNote").textContent = m.note;

    renderStats();
    bindControls();
    render();
  }

  function renderStats() {
    var jobs = DATA.jobs.filter(function (j) { return state.showBatch2 || j.batch !== 2; });
    var in1h = jobs.filter(function (j) { return j.within_1h; }).length;
    var avgMatch = Math.round(jobs.reduce(function (a, j) { return a + j.match; }, 0) / jobs.length);
    var t1 = jobs.filter(function (j) { return j.tab === 1; }).length;
    var t2 = jobs.filter(function (j) { return j.tab === 2; }).length;
    var stats = [
      { num: jobs.length, lbl: "在招岗位总数" },
      { num: t1 + " / " + t2, lbl: "本行业 / 跨行业" },
      { num: in1h, lbl: "位于 1 小时圈内" },
      { num: avgMatch + "%", lbl: "平均匹配度" }
    ];
    el("stats").innerHTML = stats.map(function (s) {
      return '<div class="stat"><div class="num">' + esc(s.num) + '</div><div class="lbl">' + esc(s.lbl) + "</div></div>";
    }).join("");
  }

  function currentJobs() {
    var list = DATA.jobs.filter(function (j) { return j.tab === state.tab; });
    if (state.tab === 2 && state.subtab !== "all") {
      list = list.filter(function (j) { return j.subtab === state.subtab; });
    }
    if (!state.showBatch2) list = list.filter(function (j) { return j.batch !== 2; });
    if (state.only1h) list = list.filter(function (j) { return j.within_1h; });
    if (state.q) {
      var q = state.q.toLowerCase();
      list = list.filter(function (j) {
        return (j.company + j.title + j.gap + j.skills.join(" ") + j.location).toLowerCase().indexOf(q) > -1;
      });
    }
    list.sort(function (a, b) {
      if (state.sort === "priority") return b.priority - a.priority;
      if (state.sort === "match") return b.match - a.match;
      if (state.sort === "salary") return (b.salary_max || 0) - (a.salary_max || 0);
      if (state.sort === "distance") return a.commute_min - b.commute_min;
      return 0;
    });
    return list;
  }

  function renderSubtabs() {
    var bar = el("subtabs");
    if (!bar) return;
    if (state.tab !== 2) { bar.style.display = "none"; bar.innerHTML = ""; return; }
    bar.style.display = "flex";
    var defs = [{ key: "all", name: "全部" }].concat(DATA.meta.subtabs || []);
    bar.innerHTML = defs.map(function (d) {
      var active = state.subtab === d.key ? " active" : "";
      return '<button class="subtab' + active + '" data-sub="' + d.key + '">' + esc(d.name) + "</button>";
    }).join("");
    Array.prototype.forEach.call(bar.querySelectorAll(".subtab"), function (b) {
      b.addEventListener("click", function () {
        state.subtab = b.getAttribute("data-sub");
        render();
      });
    });
  }

  function render() {
    renderSubtabs();
    var list = currentJobs();
    renderJobCards(list);
    renderCharts(list);
    updateLoadMore();
  }

  function updateLoadMore() {
    var wrap = el("loadMoreWrap");
    if (!wrap) return;
    // 计数跟随当前子 tab：若停在某个子 tab，只统计该子 tab 内的第二批岗位
    var hidden = DATA.jobs.filter(function (j) {
      return j.tab === state.tab && j.batch === 2 &&
        (state.tab !== 2 || state.subtab === "all" || j.subtab === state.subtab);
    }).length;
    if (state.showBatch2) {
      wrap.style.display = "block";
      el("loadMore").style.display = "none";
      el("allShown").style.display = "block";
    } else if (hidden > 0) {
      wrap.style.display = "block";
      el("loadMore").style.display = "inline-block";
      el("allShown").style.display = "none";
      el("moreCount").textContent = hidden;
    } else {
      wrap.style.display = "none";
    }
  }

  function renderJobCards(list) {
    if (!list.length) {
      el("joblist").innerHTML = '<div class="empty">没有符合筛选条件的岗位。</div>';
      return;
    }
    el("joblist").innerHTML = list.map(function (j) {
      var distCls = j.circle === "优" ? "dist" : (j.circle === "良" ? "dist warn" : "dist over");
      var skills = j.skills.map(function (s) { return '<span class="s">' + esc(s) + "</span>"; }).join("");
      var linkCls = j.link_ok ? "btn-link" : "btn-link dead";
      var linkTxt = j.link_ok ? "查看招聘链接 →" : "链接需复核";
      var deadNote = j.link_ok ? "" : '<span class="src">⚠ 链接暂不可达</span>';
      return '' +
        '<article class="job lv' + j.priority_level + '">' +
          '<div class="topline">' +
            '<div><h4>' + esc(j.title) + '</h4><div class="company">' + esc(j.company) + "</div></div>" +
            '<span class="pri ' + j.priority_level + '">优先级 ' + j.priority + " · " + j.priority_level + "</span>" +
          "</div>" +
          '<div class="tags">' +
            '<span class="tag">💰 ' + esc(j.salary_text) + "</span>" +
            '<span class="tag ' + distCls + '">🚇 约 ' + j.commute_min + " 分钟 · " + j.circle + "</span>" +
            '<span class="tag match">🎯 匹配度 ' + j.match + "%</span>" +
          "</div>" +
          '<div class="matchbar"><i style="width:' + j.match + '%"></i></div>' +
          '<div class="gap"><b>能力缺口：</b>' + esc(j.gap) + "</div>" +
          '<div class="skills">' + skills + "</div>" +
          (j.note ? '<div class="note">' + esc(j.note) + "</div>" : "") +
          '<div class="actions">' +
            '<a class="' + linkCls + '" href="' + esc(j.link) + '" target="_blank" rel="noopener"> ' + linkTxt + " </a>" +
            deadNote +
            '<span class="src">来源：' + esc(j.source) + " · " + esc(j.posted) + "</span>" +
          "</div>" +
        "</article>";
    }).join("");
  }

  var charts = {};
  function renderCharts(list) {
    if (typeof Chart === "undefined") return;
    var top = list.slice().sort(function (a, b) { return b.priority - a.priority; }).slice(0, 10);

    // Priority bar
    var barCtx = el("chartPriority");
    if (charts.bar) charts.bar.destroy();
    charts.bar = new Chart(barCtx, {
      type: "bar",
      data: {
        labels: top.map(function (j) { return (j.company.length > 8 ? j.company.slice(0, 8) + "…" : j.company); }),
        datasets: [{
          label: "投递优先级",
          data: top.map(function (j) { return j.priority; }),
          backgroundColor: top.map(function (j) { return COLORS[j.priority_level]; })
        }]
      },
      options: {
        indexAxis: "y", responsive: true,
        plugins: { legend: { display: false } },
        scales: { x: { min: 0, max: 100 } }
      }
    });

    // Scatter: 匹配度 × 通勤
    var scCtx = el("chartScatter");
    if (charts.sc) charts.sc.destroy();
    charts.sc = new Chart(scCtx, {
      type: "scatter",
      data: {
        datasets: [
          { label: "A 级", data: list.filter(function (j) { return j.priority_level === "A"; })
              .map(function (j) { return { x: j.commute_min, y: j.match, t: j.title }; }), backgroundColor: COLORS.A },
          { label: "B 级", data: list.filter(function (j) { return j.priority_level === "B"; })
              .map(function (j) { return { x: j.commute_min, y: j.match, t: j.title }; }), backgroundColor: COLORS.B },
          { label: "C 级", data: list.filter(function (j) { return j.priority_level === "C"; })
              .map(function (j) { return { x: j.commute_min, y: j.match, t: j.title }; }), backgroundColor: COLORS.C }
        ]
      },
      options: {
        responsive: true,
        plugins: {
          legend: { position: "bottom" },
          tooltip: { callbacks: { label: function (c) {
            return c.raw.t + "：通勤 " + c.raw.x + " 分 / 匹配 " + c.raw.y + "%";
          } } }
        },
        scales: {
          x: { title: { display: true, text: "潘家园单程通勤（分钟）" }, min: 0, max: 100 },
          y: { title: { display: true, text: "匹配度 (%)" }, min: 40, max: 100 }
        }
      }
    });

    // Distribution doughnut
    var distCtx = el("chartDist");
    if (charts.dn) charts.dn.destroy();
    var cnt = { A: 0, B: 0, C: 0 };
    list.forEach(function (j) { cnt[j.priority_level]++; });
    charts.dn = new Chart(distCtx, {
      type: "doughnut",
      data: {
        labels: ["A 级（优先投递）", "B 级（可考虑）", "C 级（备选/冲刺）"],
        datasets: [{ data: [cnt.A, cnt.B, cnt.C], backgroundColor: [COLORS.A, COLORS.B, COLORS.C] }]
      },
      options: { responsive: true, plugins: { legend: { position: "bottom" } } }
    });
  }

  function bindControls() {
    Array.prototype.forEach.call(document.querySelectorAll("#tabs .tab"), function (btn) {
      btn.addEventListener("click", function () {
        document.querySelectorAll("#tabs .tab").forEach(function (b) { b.classList.remove("active"); });
        btn.classList.add("active");
        state.tab = parseInt(btn.getAttribute("data-tab"), 10);
        state.subtab = "all";
        render();
      });
    });
    el("sort").addEventListener("change", function (e) { state.sort = e.target.value; render(); });
    el("only1h").addEventListener("change", function (e) { state.only1h = e.target.checked; render(); });
    el("search").addEventListener("input", function (e) { state.q = e.target.value.trim(); render(); });
    var lm = el("loadMore");
    if (lm) lm.addEventListener("click", function () { state.showBatch2 = true; render(); });
  }

  load();
})();

  </script>
</body>
